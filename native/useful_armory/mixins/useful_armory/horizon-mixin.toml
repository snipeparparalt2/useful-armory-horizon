# Useful Armory, native half (docs/native-mods.md): the behaviour the content mod can't do as
# data. It has the same id as the content mod (useful_armory .hmod), which holds the items.
# So far: the glowing items cast coloured light while held, worn or dropped.
[mod]
id = "useful_armory"
version = "0.1.1"
priority = 100

# The Horizon commit Useful Armory targets. Besides the native hook points this reads the
# player's inventory and the mob list straight from `Game`, so it is pinned to this commit.
[compatibility]
horizon_revision = "fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "useful_armory"
source = "runtime.rs"

[[module]]
id = "glue"
file = "crates/horizon-client/src/game.rs"
name = "useful_armory_glue"
source = "glue.rs"

[[injection]]
id = "visuals"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_visuals"
helper = "visuals.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "lights", ty = "&mut Vec<horizon_client::mod_api::NativeColoredLight>", value = "&mut *lights" },
]

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<horizon_client::mod_api::NativeMod>", value = "&mut *mods" },
]
