# Useful Armory, native half (docs/native-mods.md): the behaviour the content mod can't do as
# data. It has the same id as the content mod (useful_armory .hmod), which holds the items.
# The glow (glowing items cast coloured light), armour set bonuses, tool abilities, the hoes'
# harvest sweep and weapon effects, each with a switch on the mod's settings page.
[mod]
id = "useful_armory"
version = "0.1.7"
priority = 100

# The Horizon commit Useful Armory targets. Besides the native hook points and helpers it reads
# the player's inventory, the mob list and block facts straight from `Game`, and breaks extra
# blocks through the game's own player break, so it is pinned to this commit.
[compatibility]
horizon_revision = "fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "useful_armory"
source = "runtime.rs"

[[module]]
id = "glue"
file = "crates/horizon-client/src/game.rs"
name = "useful_armory_glue"
source = "glue.rs"

[[module]]
id = "gear"
file = "crates/horizon-client/src/game.rs"
name = "useful_armory_gear"
source = "gear.rs"

[[injection]]
id = "visuals"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_visuals"
helper = "visuals.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "lights", ty = "&mut Vec<horizon_client::mod_api::NativeColoredLight>", value = "&mut *lights" },
]

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<horizon_client::mod_api::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]

# Set bonuses: effects and the ultimate set's healing each player tick (with that player
# swapped in), falls and explosions in the incoming damage, the obsidian set's knockback,
# the lapis set's experience. The player tick also deals greatsword splashes.
[[injection]]
id = "player_tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_player_tick"
helper = "player_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "incoming_damage"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_living_incoming_damage_v3"
helper = "incoming_damage.rs"
bindings = [
  { name = "victim_uuid", ty = "Option<u128>", value = "victim_uuid" },
  { name = "damage_type", ty = "&str", value = "damage_type" },
  { name = "amount", ty = "&mut f32", value = "&mut *amount" },
  { name = "cancel", ty = "&mut bool", value = "&mut *cancel" },
]

[[injection]]
id = "knockback"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_living_knockback"
helper = "knockback.rs"
bindings = [
  { name = "entity", ty = "i32", value = "entity" },
  { name = "kind", ty = "&str", value = "kind" },
  { name = "strength", ty = "&mut f64", value = "&mut *strength" },
]

[[injection]]
id = "experience"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_player_exp_change"
helper = "experience.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "player", ty = "u128", value = "player" },
  { name = "amount", ty = "&mut i32", value = "&mut *amount" },
]

# Tool abilities: vein mining, wide dig and tree felling where a player's break starts, the
# harvest sweep where an item's use on a block starts.
[[injection]]
id = "destroy_block"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_destroy_block"
helper = "destroy_block.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "state", ty = "horizon_world::registry::BlockStateId", value = "state" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "use_item_on"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_use_item_on"
helper = "use_item_on.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "claimed", ty = "&mut bool", value = "&mut *claimed" },
]

# Weapon effects: damage bonuses before a player's weapon hit, fire and splashes once it
# landed, healing and heads on a kill, the heads in the mob's loot.
[[injection]]
id = "weapon_hit"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_living_incoming_damage_v2"
helper = "weapon_hit.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "entity", ty = "i32", value = "entity" },
  { name = "kind", ty = "&str", value = "kind" },
  { name = "source_position", ty = "Option<[f64; 3]>", value = "source_position" },
  { name = "victim_position", ty = "[f64; 3]", value = "victim_position" },
  { name = "victim_view", ty = "[f64; 3]", value = "victim_view" },
  { name = "weapon", ty = "Option<&horizon_client::items::ItemStack>", value = "weapon" },
  { name = "amount", ty = "&mut f32", value = "&mut *amount" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "hurt_enemy"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_hurt_enemy"
helper = "hurt_enemy.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "entity", ty = "u32", value = "entity" },
]

[[injection]]
id = "mob_killed"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mob_killed"
helper = "mob_killed.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "u128", value = "player" },
  { name = "entity", ty = "u32", value = "entity" },
  { name = "kind", ty = "&str", value = "kind" },
]

[[injection]]
id = "loot_drops"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_loot_drops"
helper = "loot_drops.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "context", ty = "&horizon_client::mod_api::NativeLootDrops<'_>", value = "context" },
  { name = "drops", ty = "&mut Vec<horizon_client::items::ItemStack>", value = "&mut *drops" },
]
